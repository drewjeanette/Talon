# Tests every push and pull request. Pushes to main deploy to talontime.org
# only after the tests pass. A failing run emails whoever pushed and leaves the
# live site on the last good version.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:e2e
      - name: Upload test report (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e/.server.log
          retention-days: 14

  deploy:
    name: Deploy to talontime.org
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://talontime.org
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7fb2c0784ed069a2a238ee33cec0a381
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations run before the new code goes live, so it never meets an old schema.
      - name: Apply database migrations
        run: npm run db:migrate:remote
      - name: Deploy Worker and site
        run: npm run deploy
      - name: Check the live site
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://talontime.org/api/health && exit 0
            sleep 5
          done
          exit 1
