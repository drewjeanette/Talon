name = "talon-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Shared Talon Cloudflare account (admin@talontime.org). Not a secret; it pins
# every wrangler command and deploy to this account.
account_id = "7fb2c0784ed069a2a238ee33cec0a381"

# Serve the app at https://talontime.org. Cloudflare creates the DNS record.
routes = [{ pattern = "talontime.org", custom_domain = true }]

# ---------------------------------------------------------------------------
# D1 binding
#
# The database id is not a secret. It is committed so every deployment points
# at the same production database.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "talon-db"
database_id = "0dd511e2-3f7c-4b1b-a7d7-1b5badcd51e4"
migrations_dir = "migrations"

[vars]
JWT_ACCESS_EXPIRY = "15m"
JWT_REFRESH_EXPIRY = "7d"
CORS_ORIGIN = "https://talontime.org,http://localhost:5173"
ENVIRONMENT = "production"
APP_URL = "https://talontime.org"
EMAIL_FROM = "Talon <no-reply@talontime.org>"

# ---------------------------------------------------------------------------
# Secrets - do NOT put these in [vars] and do NOT commit them.
# Set them per environment with:
#     npx wrangler secret put JWT_ACCESS_SECRET
#     npx wrangler secret put JWT_REFRESH_SECRET
#     npx wrangler secret put RESEND_API_KEY   (email; see docs/EMAIL.md)
# Generate values with: openssl rand -base64 48
#
# For local `wrangler dev`, put them in server/.dev.vars (git-ignored).
# ---------------------------------------------------------------------------

# Build and publish the React frontend with this Worker. Requests under /api
# run the Hono server; every other route is served as a React SPA.
[build]
command = "npm run build --workspace=client"
cwd = ".."
watch_dir = "../client/src"

[assets]
directory = "../client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Hourly: payroll deadline reminders (services/reminder.service.ts decides
# what is due in US Central time and sends each stage once).
[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
