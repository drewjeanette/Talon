name = "talon-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ---------------------------------------------------------------------------
# D1 binding
#
# The database id is not a secret. It is committed so every deployment points
# at the same production database.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "talon-db"
database_id = "69e5b518-4f96-410e-b13c-ac27e9ac618b"
migrations_dir = "migrations"

[vars]
JWT_ACCESS_EXPIRY = "15m"
JWT_REFRESH_EXPIRY = "7d"
CORS_ORIGIN = "https://talontime.org,http://localhost:5173"
ENVIRONMENT = "production"

# ---------------------------------------------------------------------------
# Secrets - do NOT put these in [vars] and do NOT commit them.
# Set them per environment with:
#     npx wrangler secret put JWT_ACCESS_SECRET
#     npx wrangler secret put JWT_REFRESH_SECRET
# Generate values with: openssl rand -base64 48
#
# For local `wrangler dev`, put them in server/.dev.vars (git-ignored).
# ---------------------------------------------------------------------------

# Build and publish the React frontend with this Worker. Requests under /api
# run the Hono server; every other route is served as a React SPA.
[build]
command = "npm run build --workspace=client"
cwd = ".."
watch_dir = "../client/src"

[assets]
directory = "../client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true
